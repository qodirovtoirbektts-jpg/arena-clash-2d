<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#050810">
  <meta name="description" content="Arena Clash 2D v3.2 — Professional 2D Cyber Brawler o'yini">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
  <title>Arena Clash 2D v3.2 — Tactical Cyber Brawler</title>
  <link rel="stylesheet" href="/src/ui/style.css">
</head>
<body>
  <div id="game-container">
    <!-- Hazard Caution Stripes (Last Grid TD imzosi) -->
    <div class="hazard-bar top"></div>
    <div class="hazard-bar bottom"></div>

    <!-- Asosiy O'yin Canvas -->
    <canvas id="gameCanvas" width="1280" height="720"></canvas>

    <!-- UI Overlay qatlami -->
    <div id="ui-root" class="ui-root"></div>

    <!-- Mobil Ekranini Burish Ogohlantirish Qatlami (Landscape Orientation Overlay) -->
    <div id="orientation-overlay" class="orientation-overlay">
      <div class="orientation-backdrop"></div>
      <div class="orientation-card">
        <div class="phone-anim-box">
          <div class="phone-device">
            <div class="phone-screen-light"></div>
            <div class="phone-notch"></div>
          </div>
          <div class="rotate-hint-arrow">↻</div>
        </div>
        <div class="orientation-tag">TOXA AI STUDIO // EKRAN TALABI</div>
        <h2 class="orientation-title">ILTIMOS, TELEFONINGIZNI GORIZONTAL QILING!</h2>
        <p class="orientation-desc">
          O'yin qulay va to'liq ekranda ishlashi uchun telefoningizni yonbosh (Landscape) holatiga buring.
        </p>
        <div class="orientation-brand-tag">
          <span>ARENA CLASH 2D</span> • OPTIMAL LANDSCAPE REJIMI
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
